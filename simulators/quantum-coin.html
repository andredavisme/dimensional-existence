<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Quantum Coin | Dimensional Existence</title>
  <link rel="stylesheet" href="../assets/css/main.css" />
  <style>
    #coin {
      width: 150px; height: 150px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #a78bfa);
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; font-weight: bold;
      margin: 2rem auto;
      cursor: pointer;
      transition: transform 0.3s;
      border: 3px solid var(--accent);
    }
    #coin.spinning { animation: spin 0.5s linear infinite; }
    @keyframes spin { from { transform: rotateY(0deg); } to { transform: rotateY(360deg); } }
    #state { text-align: center; font-size: 1.5rem; color: var(--accent); margin-top: 1rem; }
    #superposition { text-align: center; color: var(--muted); font-size: 0.9rem; }
  </style>
</head>
<body>
  <header>
    <h1>Quantum Coin</h1>
    <nav><a href="index.html">← Simulators</a></nav>
  </header>
  <main>
    <p>Before observation, the coin exists in <strong>superposition</strong> — both states simultaneously. Click to observe (collapse the wavefunction).</p>
    <div id="coin" onclick="observe()">?</div>
    <div id="superposition">State: |0⟩ + |1⟩ (superposition)</div>
    <div id="state"></div>
  </main>
  <script>
    let spinning = false;
    function observe() {
      if (spinning) return;
      spinning = true;
      const coin = document.getElementById('coin');
      coin.classList.add('spinning');
      coin.textContent = '?';
      document.getElementById('superposition').textContent = 'Collapsing wavefunction...';
      setTimeout(() => {
        coin.classList.remove('spinning');
        const result = Math.random() < 0.5 ? 'HEADS' : 'TAILS';
        coin.textContent = result === 'HEADS' ? 'H' : 'T';
        document.getElementById('state').textContent = `Observed: ${result}`;
        document.getElementById('superposition').textContent = `State collapsed to |${result === 'HEADS' ? '1' : '0'}⟩`;
        spinning = false;
      }, 800);
    }
  </script>
</body>
</html>
